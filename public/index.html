<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>NeoPin · Map</title>
    <script src="/assets/scripts/theme.js"></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css"
      integrity="sha384-Nq6PQ+9vJPvw7U/VfDELyrWoGQMsy0gi6QShhaSrGzkpF5KkM40csg2leky+YMTd"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/assets/styles/theme.css" />
    <link rel="stylesheet" href="/assets/styles/index.css" />
    <link rel="stylesheet" href="/assets/styles/modal.css" />
    <link rel="icon" type="image/x-icon" href="/assets/images/favicon.ico" />
  </head>

  <body>
    <svg class="sprite" aria-hidden="true">
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" /></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" /></symbol>
      <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><path d="M16 17l5-5-5-5M21 12H9" /></symbol>
      <symbol id="i-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" /><circle cx="12" cy="12" r="2.5" /><path d="M12 2v3M12 19v3M2 12h3M19 12h3" /></symbol>
      <symbol id="i-fit" viewBox="0 0 24 24"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3" /></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6" /></symbol>
      <symbol id="i-timeline" viewBox="0 0 24 24"><circle cx="6" cy="5" r="2.2" /><circle cx="6" cy="19" r="2.2" /><path d="M6 7.2v9.6" /><path d="M12 8h9M12 12h6M12 16h9" /></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" /></symbol>
      <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z" /></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9L12 3Z" /></symbol>
      <symbol id="i-prev" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" /></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></symbol>
      <symbol id="i-camera" viewBox="0 0 24 24"><path d="M14.5 4h-5L8 6H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3l-1.5-2Z" /><circle cx="12" cy="13" r="3.5" /></symbol>
      <symbol id="i-gap" viewBox="0 0 24 24"><path d="M3 12h3M10.5 12h3M18 12h3" /></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9" /><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" /></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14" /></symbol>
      <symbol id="i-walk" viewBox="0 0 24 24"><circle cx="13" cy="4.5" r="1.8" /><path d="m9 21 2.5-6.5L9 12.5l1.5-5 3.5 1.5 2.5 3M13 15l1.5 6M10.5 7.5 8 10" /></symbol>
      <symbol id="i-bike" viewBox="0 0 24 24"><circle cx="5.5" cy="17" r="3.5" /><circle cx="18.5" cy="17" r="3.5" /><path d="M12 17 9 9h5l4.5 8M9 9 7.5 6H6M14 9l-2 8" /></symbol>
      <symbol id="i-car" viewBox="0 0 24 24"><path d="M5 17H3v-5l2.2-5.2A2 2 0 0 1 7 5.6h10a2 2 0 0 1 1.8 1.2L21 12v5h-2M5 17h14M5 17a2 2 0 1 0 4 0m6 0a2 2 0 1 0 4 0M3 12h18" /></symbol>
      <symbol id="i-place" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21Z" /><circle cx="12" cy="9.5" r="2.5" /></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5" /><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.2a6.5 6.5 0 0 1 3.5 5.8" /></symbol>
      <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4" /><path d="m11 12 9-9M16 7l3 3M14 9l2 2" /></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" /><path d="M4 21a8 8 0 0 1 16 0" /></symbol>
      <symbol id="i-group" viewBox="0 0 24 24"><circle cx="12" cy="7" r="3" /><circle cx="5.5" cy="16.5" r="2.5" /><circle cx="18.5" cy="16.5" r="2.5" /><path d="M8 21a4 4 0 0 1 8 0" /></symbol>
      <symbol id="i-phone" viewBox="0 0 24 24"><rect width="12" height="20" x="6" y="2" rx="2.5" /><path d="M11 18h2" /></symbol>
      <symbol id="i-tablet" viewBox="0 0 24 24"><rect width="20" height="16" x="2" y="4" rx="2.5" /><path d="M18 12h.01" /></symbol>
      <symbol id="i-laptop" viewBox="0 0 24 24"><rect width="16" height="11" x="4" y="5" rx="2" /><path d="M2 20h20" /></symbol>
    </svg>

    <div class="loader" id="loader" role="status" aria-label="Loading">
      <div class="spinner"></div>
    </div>

    <div id="map"></div>
    <p class="map-credit">© OpenStreetMap · OpenFreeMap</p>

    <!-- Heads-up display over the map: who is where, how many are online, the connection. -->
    <header class="hud">
      <div class="hud-right">
        <div class="hud-tile hud-stat" aria-label="Devices online">
          <span class="hud-stat__value"><span id="onlineCount">0</span><small>/<span id="totalCount">0</span></small></span>
          <span class="hud-stat__label">online</span>
        </div>
        <div class="hud-account-wrap" id="accountWrap">
          <button class="hud-tile hud-account" id="accountButton" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="accountMenu" aria-label="Account">
            <span id="accountAvatar"></span>
            <span class="notify-dot notify-dot--tile" id="accountDot" hidden></span>
            <span class="hud-account__name" id="accountName"></span>
          </button>
          <div class="account-menu" id="accountMenu" hidden>
            <div class="account-menu__who">
              <span id="accountAvatarLg"></span>
              <span class="account-menu__text">
                <strong id="accountNameLg"></strong>
                <span id="accountUsername"></span>
              </span>
            </div>
            <button class="menu-item" id="openDevices" type="button"><svg class="icon"><use href="#i-phone" /></svg>My devices</button>
            <button class="menu-item" id="openGroups" type="button"><svg class="icon"><use href="#i-group" /></svg>Groups<span class="notify-dot" id="groupsDot" hidden></span></button>
            <button class="menu-item" id="openAccounts" type="button" hidden><svg class="icon"><use href="#i-users" /></svg>Accounts</button>
            <button class="menu-item" id="openProfile" type="button"><svg class="icon"><use href="#i-user" /></svg>Edit profile</button>
            <button class="menu-item" id="openPassword" type="button"><svg class="icon"><use href="#i-key" /></svg>Change password</button>
            <button class="menu-item" id="avatarUpload" type="button"><svg class="icon"><use href="#i-camera" /></svg>Change picture</button>
            <button class="menu-item" id="avatarRemove" type="button"><svg class="icon"><use href="#i-trash" /></svg>Remove picture</button>
            <a class="menu-item" href="/logout"><svg class="icon"><use href="#i-logout" /></svg>Log out</a>
            <div class="account-menu__about" id="aboutServer"></div>
            <input id="avatarFile" type="file" accept="image/*" hidden />
          </div>
        </div>
        <div class="hud-tile hud-tools">
          <button class="icon-btn" id="timelineButton" type="button" aria-pressed="false" aria-label="Show the timeline" title="Timeline">
            <svg class="icon"><use href="#i-timeline" /></svg>
          </button>
          <button class="icon-btn" id="refreshButton" type="button" aria-label="Ask every device for a fresh position" title="Refresh positions">
            <svg class="icon"><use href="#i-refresh" /></svg>
          </button>
          <button class="icon-btn" type="button" data-theme-toggle aria-label="Switch between light and dark mode" title="Light or dark">
            <svg class="icon theme-icon--dark"><use href="#i-moon" /></svg>
            <svg class="icon theme-icon--light"><use href="#i-sun" /></svg>
          </button>
          <a class="icon-btn" href="/logout" aria-label="Log out" title="Log out">
            <svg class="icon"><use href="#i-logout" /></svg>
          </a>
        </div>
      </div>
    </header>

    <div class="banner" id="pwBanner" role="status" hidden>
      <svg class="icon"><use href="#i-key" /></svg>
      <span>You are using a generated password. Change it now.</span>
      <button class="btn btn--small" id="pwBannerButton" type="button">Change password</button>
    </div>

    <section class="devices" id="devicesPanel" aria-label="People" data-expanded="true">
      <button class="devices__head" id="panelToggle" type="button" aria-controls="devicesBody" aria-expanded="true">
        <span class="devices__title">
          <strong>People</strong>
          <span class="conn" id="status" data-state="connecting" role="status">
            <span class="conn__dot"></span>
            <span class="conn__text" id="summary">Connecting…</span>
          </span>
        </span>
        <span class="devices__stack" id="avatarStack" aria-hidden="true"></span>
        <svg class="icon devices__chevron" aria-hidden="true"><use href="#i-chevron" /></svg>
      </button>
      <div class="devices__body" id="devicesBody">
        <div class="chips" id="groupChips" role="group" aria-label="Show people of a group" hidden></div>
        <ul class="device-list" id="deviceList" role="list"></ul>
      </div>
    </section>

    <section class="timeline" id="timelinePanel" aria-label="Timeline" hidden>
      <div class="timeline__head">
        <strong>Timeline</strong>
        <button class="icon-btn" id="timelineClose" type="button" aria-label="Close the timeline" title="Back to live view">
          <svg class="icon"><use href="#i-close" /></svg>
        </button>
      </div>
      <div class="timeline__controls">
        <select class="select" id="tlAccount" aria-label="Account" hidden></select>
        <select class="select" id="tlDevice" aria-label="Device"></select>
        <div class="daynav">
          <button class="icon-btn" id="tlPrev" type="button" aria-label="Previous day with data" title="Previous day"><svg class="icon"><use href="#i-prev" /></svg></button>
          <input class="date" id="tlDate" type="date" aria-label="Day" />
          <button class="icon-btn" id="tlNext" type="button" aria-label="Next day with data" title="Next day"><svg class="icon"><use href="#i-next" /></svg></button>
        </div>
      </div>
      <div class="timeline__body" id="tlBody"></div>
    </section>

    <div class="modal" id="modal" hidden>
      <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal__head">
          <strong id="modalTitle"></strong>
          <button class="icon-btn" id="modalClose" type="button" aria-label="Close"><svg class="icon"><use href="#i-close" /></svg></button>
        </div>
        <div class="modal__body" id="modalBody"></div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script
      src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"
      integrity="sha384-GfxBM9x46BaAFxtCq39Fxir8fNZ4VDnwgfi6Kzi5/F1tAFsm0amuuV8kd+Pxzuf/"
      crossorigin="anonymous"
    ></script>
    <script src="/assets/scripts/cluster.js"></script>
    <script src="/assets/scripts/dashboard.js"></script>
    <script src="/assets/scripts/account.js"></script>
    <script src="/assets/scripts/timeline.js"></script>
    <script src="/assets/scripts/manage.js"></script>
    <script src="/assets/scripts/crop.js"></script>
    <script src="/assets/scripts/groups.js"></script>
  </body>
</html>
