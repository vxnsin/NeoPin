<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeoPin - Home</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link rel="stylesheet" href="assets/styles/index.css" />
    <link rel="stylesheet" href="assets/styles/theme.css" />

    <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
  </head>

  <body data-theme="dark">
    <div id="spinner" class="spinner"></div>
    <div class="wrapper-body" id="content">
        <div class="container-map-by">
            <a href="https://leafletjs.com/">Leaflet</a>
        </div>
        <div id="map"></div>

        <div class="menu-button" id="menuButton">
        <i class="fas fa-cog"></i>
        </div>

        <div class="menu-box">
        <div id="menu" class="dropdown-menu">
            <div class="icon" id="refreshButton">
                <i class="fa fa-refresh"></i>
            </div>
            <div onclick="window.location.href='/logout'" class="icon">
                <i class="fas fa-sign-out-alt"></i>
            </div>
        </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        let map;
      let menuOpen = false;
      let loaded = false;
      let layer;

      function showLoader() {
        const spinner = document.getElementById("spinner");
        const content = document.getElementById("content");
        document.body.classList.remove("loaded");
        document.body.classList.add("loading");
        content.classList.remove("loaded"); 
        spinner.style.opacity = 1;  
      }

      function hideLoader() {
        const spinner = document.getElementById("spinner");
        const content = document.getElementById("content");
        document.body.classList.remove("loading");
        document.body.classList.add("loaded");
        content.classList.add("loaded");                 
        spinner.style.opacity = 0;  
      }

    function initMap() {
        showLoader();
        
        map = L.map("map").setView([50.5561, 9.6333], 6);
        let bounds = [
          [-90, -180],
          [90, 180],
        ];
        map.setMaxBounds(bounds);
        layer = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {"attribution": "Mapbox", "detectRetina": false, "maxNativeZoom": 19, "maxZoom": 20, "minZoom": 0, "noWrap": true, "opacity": 1, "subdomains": "abc", "tms": false})
        .addTo(map);
      }
      setTimeout(() => {
        if(!loaded) {
              fetchDeviceData();
              hideLoader();
              loaded = true;
        }
      }, 1000);

      var markers = {};
      function fetchDeviceData() {
        fetch("/api/sendPing", {
            method: "POST",
            credentials: "include"
        })

        fetch("/api/getData", {
        method: "GET",
        credentials: "include", 
       })
          .then((response) => {
            if (!response.ok) {
              throw new Error(`HTTP error! Status: ${response.status}`);
            }
            return response.json();
          })
          .then((data) => {
            console.log(data)

            for (const deviceId in markers) {
              map.removeLayer(markers[deviceId]);
            }

            data.forEach((device) => {
              const { latitude, longitude } = device.position || {};
              if (latitude != null && longitude != null) {
                const marker = L.marker([latitude, longitude]).addTo(map);
                marker.bindPopup(
                  `<b>${device.deviceId}</b><br>${latitude}, ${longitude}`
                );
                markers[device.deviceId] = marker;
              }
            });
          })
          .catch((error) => {
            console.error("Error fetching device data:", error);
          });
      }

      document.getElementById("menuButton").onclick = function () {
        const menu = document.getElementById("menu");
        menu.classList.toggle("show");
        this.classList.toggle("rotate");
        menuOpen = !menuOpen;
      };

      document.addEventListener("click", function (event) {
        const menu = document.getElementById("menu");
        const menuButton = document.getElementById("menuButton");

        if (
          !menu.contains(event.target) &&
          event.target !== menuButton &&
          menuOpen
        ) {
          menu.classList.remove("show");
          menuButton.classList.remove("rotate");
          menuOpen = false;
        }
      });

      document.getElementById("refreshButton").onclick = async function () {
        const refreshIcon = this.querySelector("i");
        refreshIcon.classList.add("fa-spin");

        await fetchDeviceData();
        setTimeout(() => {
          refreshIcon.classList.remove("fa-spin");
        }, 1000);
      };
      initMap();
    </script>
  </body>
</html>
