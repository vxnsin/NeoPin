<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeoPin - Home</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="assets/styles/index.css" />
    <link rel="stylesheet" href="assets/styles/theme.css" />
    <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico" />
  </head>

  <body data-theme="dark">
    <div id="spinner" class="spinner"></div>
    <div class="wrapper-body" id="content">
      <div id="map"></div>

      <div class="status-pill" id="status" data-state="connecting">
        <span class="status-dot"></span>
        <span class="status-text">Connecting…</span>
      </div>

      <div class="menu-button" id="menuButton" title="Menu">
        <i class="fas fa-cog"></i>
      </div>

      <div class="menu-box">
        <div id="menu" class="dropdown-menu">
          <div class="icon" id="refreshButton" title="Ask all devices for a fresh position">
            <i class="fas fa-rotate"></i>
          </div>
          <div class="icon" id="listButton" title="Device list">
            <i class="fas fa-list"></i>
          </div>
          <div class="icon" id="logoutButton" title="Logout">
            <i class="fas fa-right-from-bracket"></i>
          </div>
        </div>
      </div>

      <aside class="device-panel" id="devicePanel">
        <header>
          <strong>Devices</strong>
          <button id="closePanel" aria-label="Close"><i class="fas fa-xmark"></i></button>
        </header>
        <ul id="deviceList"></ul>
      </aside>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="assets/scripts/dashboard.js"></script>
  </body>
</html>
