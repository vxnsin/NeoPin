<!DOCTYPE html>
<html lang="en" data-theme="dark" data-theme-locked>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>NeoPin · Sign in</title>
    <script src="/assets/scripts/theme.js"></script>
    <link rel="stylesheet" href="/assets/styles/theme.css" />
    <link rel="stylesheet" href="/assets/styles/login.css" />
    <link rel="icon" type="image/x-icon" href="/assets/images/favicon.ico" />
  </head>

  <body>
    <svg class="sprite" aria-hidden="true">
      <symbol id="i-lock" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" /><circle cx="12" cy="12" r="3" /></symbol>
      <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" /><path d="M10.73 5.08A10.4 10.4 0 0 1 12 5c7 0 10 7 10 7a13.2 13.2 0 0 1-1.67 2.68" /><path d="M6.61 6.61A13.5 13.5 0 0 0 2 12s3 7 10 7a9.7 9.7 0 0 0 5.39-1.61" /><path d="M2 2l20 20" /></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" /><path d="M4 21a8 8 0 0 1 16 0" /></symbol>
      <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4" /><path d="m11 12 9-9M16 7l3 3M14 9l2 2" /></symbol>
      <symbol id="i-fingerprint" viewBox="0 0 24 24"><path d="M12 11v3a8 8 0 0 1-1.5 4.7" /><path d="M8.5 13.5a20 20 0 0 1-1.2 5" /><path d="M15.5 12.5v1.5a12 12 0 0 1-.9 4.6" /><path d="M5 15.5A12 12 0 0 0 5.5 11a6.5 6.5 0 0 1 11.6-4" /><path d="M8.6 9A3.5 3.5 0 0 1 15.5 11" /><path d="M18.8 10a14 14 0 0 1 .2 3.5" /></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" /></symbol>
    </svg>

    <!-- Flying low over a dark town; login.js moves the ground and lets device markers ping on it. -->
    <div class="backdrop" aria-hidden="true">
      <div class="backdrop__plane" id="plane"><div class="backdrop__ground" id="ground"></div><div class="backdrop__dim"></div></div>
      <div class="backdrop__fog"></div>
    </div>

    <main class="login">
      <div class="login__card">
        <img class="login__logo" src="/assets/images/logo.png" width="76" height="76" alt="" />
        <h1>NeoPin</h1>
        <p class="login__lead" id="lead">Sign in to see where your devices are.</p>

        <form id="loginForm" novalidate>
          <label class="field" for="code" id="codeField" hidden>
            <span class="field__label">Invite code</span>
            <span class="field__control">
              <svg class="icon field__icon"><use href="#i-key" /></svg>
              <input id="code" name="code" type="text" autocomplete="off" placeholder="XXXXX-XXXXX" autocapitalize="characters" spellcheck="false" maxlength="24" />
            </span>
            <span class="login__note" id="codeNote" aria-live="polite"></span>
          </label>

          <label class="field" for="username">
            <span class="field__label">Username</span>
            <span class="field__control">
              <svg class="icon field__icon"><use href="#i-user" /></svg>
              <input id="username" name="username" type="text" autocomplete="username" placeholder="Username" autocapitalize="none" spellcheck="false" required autofocus />
            </span>
          </label>

          <label class="field" for="displayName" id="displayNameField" hidden>
            <span class="field__label">Display name <small>(optional)</small></span>
            <span class="field__control">
              <svg class="icon field__icon"><use href="#i-user" /></svg>
              <input id="displayName" name="displayName" type="text" autocomplete="nickname" placeholder="How your name is shown" maxlength="64" />
            </span>
          </label>

          <label class="field" for="password">
            <span class="field__label">Password</span>
            <span class="field__control">
              <svg class="icon field__icon"><use href="#i-lock" /></svg>
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" required />
              <button class="field__toggle" type="button" id="togglePassword" aria-label="Show password" aria-pressed="false">
                <svg class="icon"><use href="#i-eye" /></svg>
              </button>
            </span>
          </label>

          <label class="field" for="confirm" id="confirmField" hidden>
            <span class="field__label">Repeat password</span>
            <span class="field__control">
              <svg class="icon field__icon"><use href="#i-lock" /></svg>
              <input id="confirm" name="confirm" type="password" autocomplete="new-password" placeholder="Repeat the password" />
            </span>
          </label>

          <p class="login__error" id="message" role="alert" aria-live="polite"></p>

          <button class="btn login__submit" type="submit" id="submit">
            <span id="submitLabel">Sign in</span>
            <svg class="icon"><use href="#i-arrow" /></svg>
          </button>
        </form>

        <div class="login__passkey" id="passkeyRow" hidden>
          <span class="login__or">or</span>
          <button class="btn btn--ghost login__passkey-btn" type="button" id="passkeyButton">
            <svg class="icon"><use href="#i-fingerprint" /></svg>
            <span>Sign in with a passkey</span>
          </button>
        </div>

        <p class="login__switch" id="switchRow" hidden>
          <span id="switchText">Have an invite code?</span>
          <button class="login__link" type="button" id="switchMode">Create account</button>
        </p>

      </div>
      <p class="login__foot">Self-hosted. Your locations never leave your server.</p>
    </main>

    <script src="/assets/scripts/invitecode.js"></script>
    <script src="/assets/scripts/webauthn.js"></script>
    <script src="/assets/scripts/login.js"></script>
  </body>
</html>
