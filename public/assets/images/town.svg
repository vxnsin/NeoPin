    <rect x="800" y="150" width="170" height="90" rx="8" />
    <rect x="1040" y="150" width="280" height="130" rx="8" />
    <rect x="1390" y="150" width="190" height="130" rx="8" />
    <rect x="800" y="380" width="250" height="110" rx="8" />
    <rect x="1390" y="350" width="190" height="140" rx="8" />
    <rect x="20" y="550" width="140" height="70" rx="8" />
    <rect x="215" y="550" width="190" height="70" rx="8" />
    <rect x="800" y="550" width="230" height="80" rx="8" />
    <rect x="20" y="890" width="140" height="90" rx="8" />
    <rect x="215" y="890" width="180" height="90" rx="8" />
    <rect x="460" y="890" width="270" height="90" rx="8" />
