services:
  neopin:
    image: ghcr.io/vxnsin/neopin-server:latest
    # To build from this checkout instead of pulling, comment out `image` and use:
    # build: .
    pull_policy: always
    ports:
      - "3012:3012"
    environment:
      - PORT=3012
      # The admin password is generated on the first start and printed once in the logs.
      # - TRUST_PROXY=true       # behind a reverse proxy
      # - SECURE_COOKIES=true    # once HTTPS is in place
      # - PUBLIC_URL=https://neopin.example.com   # for passkeys behind a proxy
      # - HISTORY_DAYS=365
    volumes:
      - neopin-data:/app/data
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

  # Optional: checks for a new image every 5 minutes and restarts only labelled containers.
  # watchtower:
  #   image: nickfedor/watchtower:latest
  #   command: --label-enable --cleanup --interval 300
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   restart: unless-stopped

volumes:
  neopin-data:
