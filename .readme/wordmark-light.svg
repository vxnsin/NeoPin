<svg xmlns="http://www.w3.org/2000/svg" width="582" height="200" viewBox="0 0 582 200" role="img" aria-label="NeoPin">
  <title>NeoPin</title>
  <style>
    .logo { transform-box: fill-box; transform-origin: 50% 50%; animation: land .7s cubic-bezier(.34,1.56,.64,1) both; }
    .ring { transform-box: fill-box; transform-origin: 50% 50%; opacity: 0; animation: pulse 1.3s cubic-bezier(.25,.46,.45,.94) .5s both, loop 5s cubic-bezier(.25,.46,.45,.94) 5s infinite; }
    .ring2 { animation-delay: .78s, 5.28s; }
    @keyframes loop { 0% { opacity: 0; transform: scale(1); } 2% { opacity: .4; } 26%, 100% { opacity: 0; transform: scale(1.45); } }
    .word { animation: word .5s cubic-bezier(.22,1,.36,1) .6s both; }
    @keyframes land { 0% { opacity: 0; transform: translateY(-34px) scale(.55); } 45% { opacity: 1; } 100% { opacity: 1; transform: none; } }
    @keyframes pulse { 0% { opacity: 0; transform: scale(1); } 8% { opacity: .55; } 100% { opacity: 0; transform: scale(1.45); } }
    @keyframes word { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .logo, .word { animation: none; } .ring { animation: none; opacity: 0; } }
  </style>
  <circle class="ring" cx="104" cy="100" r="64" fill="none" stroke="#d3171e" stroke-width="2.5"/>
  <circle class="ring ring2" cx="104" cy="100" r="64" fill="none" stroke="#d3171e" stroke-width="1.5"/>
